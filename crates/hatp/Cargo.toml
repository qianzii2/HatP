[package]
name        = "hatp"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
license     = "Apache-2.0"
description = "HatP — embedded HTAP engine facade (DataFusion + Vortex)."

[lints]
# 手动复制 workspace lints，仅覆盖 unsafe_code 为 allow。
[lints.rust]
unsafe_code                         = "allow"
missing_debug_implementations       = "warn"
rust_2018_idioms                    = { level = "warn", priority = -1 }
unexpected_cfgs                     = "allow"

[lints.clippy]
unwrap_used               = "deny"
expect_used               = "deny"
panic                     = "deny"
todo                      = "deny"
unimplemented             = "deny"
indexing_slicing          = "deny"
unwrap_or_default         = "deny"
missing_panics_doc        = "warn"
module_name_repetitions   = "allow"

[dependencies]
# Local crates
hatp-frontend = { path = "../hatp-frontend" }
hatp-engine   = { path = "../hatp-engine" }
hatp-tx       = { path = "../hatp-tx" }

# External — only DataFusion + Arrow per the HatP stated invariant
datafusion                = { workspace = true }
datafusion-common         = { workspace = true }
datafusion-catalog        = { workspace = true }
datafusion-datasource-arrow = { workspace = true }

# Arrow runtime for the embedded facade.
arrow         = { workspace = true }
arrow-array   = { workspace = true }
arrow-schema  = { workspace = true }

# DataFusion for CSV ingestion.
datafusion-datasource-csv = { workspace = true }
datafusion-execution      = { workspace = true }

# Plumbing
thiserror    = { workspace = true }
tracing      = { workspace = true }
parking_lot  = { workspace = true }
bytes        = { workspace = true }
tokio        = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
futures      = { workspace = true }

[dev-dependencies]
tokio              = { workspace = true }
arrow-array        = { workspace = true }
arrow-schema       = { workspace = true }
arrow-ipc          = { workspace = true }
arrow              = { workspace = true }
tempfile           = "3"
tracing-subscriber = { workspace = true }
futures            = { workspace = true }
