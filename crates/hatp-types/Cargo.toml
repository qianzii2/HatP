[package]
name         = "hatp-types"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
description  = "Shared types, constants, and Arrow/ScalarValue codecs for HatP crates."

[lints]
# 手动复制 workspace lints，仅覆盖 unsafe_code 为 allow。
# Cargo 在 `workspace = true` 时不允许局部覆盖。
[lints.rust]
unsafe_code                         = "allow"
missing_debug_implementations       = "warn"
rust_2018_idioms                    = { level = "warn", priority = -1 }
unexpected_cfgs                     = "allow"

[lints.clippy]
unwrap_used               = "deny"
expect_used               = "deny"
panic                     = "deny"
todo                      = "deny"
unimplemented             = "deny"
indexing_slicing          = "deny"
unwrap_or_default         = "deny"
missing_panics_doc        = "warn"
module_name_repetitions   = "allow"

[dependencies]
bytes             = { workspace = true }
arrow-array       = { workspace = true }
arrow-schema      = { workspace = true }
datafusion-common = { workspace = true }

[dev-dependencies]
proptest = { version = "1", features = ["std"] }
arrow-array  = { workspace = true }
arrow-schema = { workspace = true }
