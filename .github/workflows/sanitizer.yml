name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  careful:
    name: cargo-careful
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src
      - run: rustup override set nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-careful
      - run: cargo careful test -p hatp-engine
