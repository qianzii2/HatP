# =============================================================================
# HatP Supply-Chain Policy
# Run: cargo deny check

[advisories]
vulnerability = "deny"
unmaintained   = "warn"
unsound        = "deny"
yanked         = "deny"

[licenses]
unlicensed = "deny"
allow = [
    "Apache-2.0",
    "MIT",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-DFS-2016",
    "ISC",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]
copyleft = "deny"
default   = "deny"

[bans]
multiple-versions = "deny"
wildcards         = "deny"
# Unavoidable duplicate versions in the DataFusion/Arrow/Vortex ecosystem.
# Generated by: cargo tree -d | grep -E '^[a-z]' | sort -u
# Re-run `cargo deny check bans` after dependency updates and adjust.
skip = [
    { name = "bit-vec", version = "0.8" },
    { name = "syn", version = "1" },
    { name = "hashbrown", version = "0.14" },
    { name = "indexmap", version = "1" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index", "https://static.crates.io/crates"]


[features]
# tokio-uring is Linux-only and gated in Cargo.toml.
# Ensure it's never accidentally enabled on non-Linux.
deny = [
    { name = "tokio-uring", platforms = ["windows", "macos"] },
]
