# HatP Supply-Chain Policy
# Run: cargo deny check

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "0BSD",
    "ISC",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "deny"
wildcards         = "deny"
# Unavoidable duplicate versions in the DataFusion/Arrow/Vortex ecosystem.
skip = [
    { name = "bit-vec", version = "0.8" },
    { name = "syn", version = "1" },
    { name = "hashbrown", version = "0.14" },
    { name = "indexmap", version = "1" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index", "https://static.crates.io/crates"]